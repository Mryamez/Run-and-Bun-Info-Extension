<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Run & Bun Dex</title>
<style>
  body{margin:0;width:360px;background:#f3f4f6;font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d1f24}
  header{background:#e3350d;color:#fff;padding:10px 12px;font-weight:700}
  main{padding:10px}
  input[type=search]{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #c4c8cf;border-radius:8px;font:inherit;margin-bottom:8px}
  #results{max-height:340px;overflow:auto}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;margin:12px 0 4px}
  ul{margin:0;padding-left:18px}
  li{margin-bottom:2px}
  label{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:12px}
  .hint{font-size:11.5px;color:#6b7280;margin-top:6px}
</style>
</head>
<body>
<header>Run & Bun Dex · Gen 8</header>
<main>
  <input id="q" type="search" placeholder="Search a move, ability or item…" autofocus>
  <div id="results"></div>
  <h2>Run & Bun mechanic changes</h2>
  <ul id="general"></ul>
  <label><input id="showButton" type="checkbox"> Show the <b>?</b> button when I highlight a name</label>
  <div class="hint">You can also right-click highlighted text, or press Alt+Shift+L.</div>
</main>
<script src="data.js"></script>
<script src="lookup.js"></script>
<script src="popup.js"></script>
</body>
</html>
